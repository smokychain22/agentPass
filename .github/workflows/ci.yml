name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cursor/**", "feat/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPODIET_TEST_OFFLINE: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Dockerfile.seller's node:22-bookworm-slim, not an
          # arbitrary bump: the pinned `openclaw` package (a real
          # dependency as of this PR, needed for
          # src/lib/okx-runtime/gateway-rpc-probe.ts's direct Gateway
          # client import) pulls in a bundled undici whose CacheStorage
          # implementation calls `webidl.util.markAsUncloneable`, which
          # does not exist on Node 20 — reproduced directly in CI
          # (`TypeError: webidl.util.markAsUncloneable is not a function`
          # inside node_modules/openclaw/node_modules/undici) before this
          # fix. Production has never run this code on anything older
          # than Node 22, so this brings CI in line with reality rather
          # than papering over a real incompatibility.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Noninteractive lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Worker build
        run: npm run build:worker

      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  seller-runtime-image:
    name: docker-seller-runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the seller runtime image (real build, not static inspection)
        run: docker build --progress=plain -f Dockerfile.seller -t repodiet-seller:ci .

  contracts:
    name: delivery-okx-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPODIET_TEST_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Delivery readiness contracts
        run: npx tsx test/delivery-readiness.test.ts
      - name: Controlled delivery scope
        run: npx tsx test/controlled-delivery-scope.test.ts
      - name: A2A settlement lifecycle
        run: npx tsx test/a2a-settlement-lifecycle.test.ts
      - name: A2MCP quote lifecycle
        run: npx tsx test/a2mcp-quote-lifecycle.test.ts
      - name: OKX A2A escrow rails
        run: npx tsx test/okx-a2a-escrow-rails.test.ts
      - name: Preview dry-run safety
        run: npx tsx test/preview-dry-run.test.ts
      - name: Production-grade fail-closed gates
        run: npx tsx test/production-grade-fail-closed.test.ts
      - name: OKX runtime isolation, policy, replay, and payment client
        run: npm run test:okx-runtime
