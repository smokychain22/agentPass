# fly.toml — RepoDiet seller runtime (Agent 9636), Fly.io testing target.
#
# Replaces a stray fly.toml auto-committed by the Fly.io GitHub integration
# ("New files from Fly.io Launch", PR #113) for an app named `agentpass`
# that does not correspond to any app this project actually uses — the
# canonical Fly app for this runtime is `repodiet-agent-9636` (already
# created; no Machine or volume exists on it yet). See
# docs/SELLER_RUNTIME_DEPLOYMENT.md for the full deployment runbook.
#
# This file intentionally does NOT deploy or create infrastructure by
# itself — `fly deploy` / `fly volumes create` / `fly secrets deploy` are
# operator actions run separately. The Fly account behind this app is on a
# limited free trial: this is a testing target, not a claim of permanent
# 24/7 hosting. See "Permanent Linux VM deployment path" in the runbook for
# the long-term host.

app = "repodiet-agent-9636"
primary_region = "sin"  # Singapore — current operator-selected candidate only, not a durability claim.

[build]
  dockerfile = "Dockerfile.seller"

# Non-secret runtime identity/paths only (see task instructions: these are
# explicitly not secrets). The seven staged secrets
# (REPODIET_OKX_RUNTIME_HEARTBEAT_SECRET, OPENCLAW_GATEWAY_TOKEN,
# GITHUB_APP_*) are set via `fly secrets set` (already staged) — never here.
[env]
  HOME = "/persistent/home"
  XDG_DATA_HOME = "/persistent/data"
  REPODIET_OKX_RUNTIME_ROOT = "/persistent/data/okx-runtimes"
  REPODIET_OKX_AGENT_ID = "9636"
  REPODIET_OKX_RUNTIME_ROLE = "seller"
  REPODIET_OKX_A2A_PROVIDER = "openclaw"
  REPODIET_PRODUCTION_URL = "https://skillswap-virid-kappa.vercel.app"
  # Not secret — the canonical GitHub App's public slug (see
  # https://github.com/apps/repodiet-operator). Required alongside the 5
  # staged GitHub App secrets: src/lib/github-app/config.ts's
  # isGitHubAppConfigured() checks this too, and it was previously missing
  # from both the staged secrets and this file.
  GITHUB_APP_SLUG = "repodiet-operator"
  # Operator kill switch for the autonomous system-event path. "1" suspends
  # startup recovery AND the poll loop; anything else (including absence)
  # leaves production behaving exactly as before.
  #
  # DISENGAGED on 2026-08-07, and deliberately not set to "0" but REMOVED —
  # the code default is already "not suspended", so an absent variable is the
  # honest expression of "not suspended" and leaves nothing to misread.
  #
  # It was engaged because funded job 0x22a2… replayed on every restart and
  # saturated this shared-cpu-1x/2GB machine. That is now fixed at the root
  # rather than by a global pause, which is what this switch could never be for
  # a LISTED agent: it also stops every legitimate NEW job event
  # (`job_asp_selected`, `job_accepted`) from ever being drained from the
  # spool, so a marketplace reviewer who creates a task would be met with
  # permanent silence. Suspension is safe for diagnosis and unacceptable as a
  # steady state.
  #
  # What replaced it, all per-event rather than global:
  #   - Incident #18 (system-event-route.ts): the retry delay `decideRetry` has
  #     always computed is now actually recorded and honoured, so a repeatedly
  #     failing event quarantines itself for up to an hour instead of replaying
  #     every 60s and immediately on every restart.
  #   - heavy-job-limiter.ts: at most one repository execution at a time on this
  #     machine, under a wall-clock bound.
  #   - workspace-install.ts: dependency installs are killed by PROCESS GROUP on
  #     timeout, so nothing they spawned outlives the deadline.
  #
  # The switch itself is kept in the code as an operator lever for the next
  # incident. If it is ever set again, it must be temporary: while it is on,
  # this agent cannot serve new marketplace work.
  # Provider application for open A2A jobs. `live` broadcasts a real,
  # irreversible, gas-spending `onchainos agent apply` for every job that
  # passes the full eligibility gate in src/lib/okx-runtime/provider-apply.ts.
  #
  # Declared here rather than as a secret because it is policy, not a
  # credential, and its value must be reviewable in the diff — flipping this
  # is the difference between observing and transacting.
  #
  # Safe to run live because the gate refuses anything that is not this
  # agent's registered service at its registered price on a real repository:
  # verified against the seven live open jobs, every one of which is refused
  # (0.00001 USDT against a 1 USD₮0 listing, scoped to github.com/example/repo,
  # which does not exist). The code default is `dry_run`, so an unset or
  # misspelled value observes rather than transacts.
  REPODIET_PROVIDER_APPLY_MODE = "live"

# This runtime is an outbound XMTP/HTTPS client (heartbeat POST, OpenClaw
# Gateway is loopback-only at 127.0.0.1:18789), never a server other agents
# or the public internet connect to inbound. Deliberately NO
# [http_service] / [[services]] block: that block is what allocates a
# public IP and a Fly Proxy HTTP endpoint, and is also the only mechanism
# that drives Fly's proxy-idle "auto stop machines" behavior. Omitting it
# means there is no public HTTP service, no public IP, AND no proxy-driven
# autostop to disable in the first place. The machine's own lifecycle is
# controlled by [[restart]] below plus the explicit --autostop=off
# documented under "Operator commands after this PR is merged" in the
# deployment runbook (a Machines-API-level flag, not a fly.toml block, as
# of the flyctl version in use).

# Array-of-tables, not a single table: `fly config validate` rejects
# `[restart]` with "json: cannot unmarshal object into Go struct field
# Config.restart of type []appconfig.Restart" — confirmed directly against
# the real flyctl schema (both locally and via a live GitHub Actions
# deploy run) after an initial guess got this wrong.
#
# TEMPORARILY changed from policy = "always" to a bounded
# "on-failure"/retries = 3 while the new idempotent bootstrap
# (scripts/seller-runtime-supervisor.ts, src/lib/okx-runtime/openclaw-
# bootstrap.ts) is validated: an unbounded "always" restart loop is exactly
# what let the previous boot-time network dependency burn trial runtime
# silently (see docs/SELLER_RUNTIME_DEPLOYMENT.md incident writeup). This
# change is NOT deployed by this PR — see the runbook for reverting to
# policy = "always" once the new bootstrap has proven itself stable in
# production.
[[restart]]
  policy = "on-failure"
  retries = 3

# Persistent volume. Must exist before the first deploy — this repo does
# not create it. Expected name: repodiet_persistent (matches
# docker-compose.production.yml's single-volume shape exactly, so the
# in-container path contract is identical across Fly and the Linux VM
# path). Not created by this PR — see runbook for the exact `fly volumes
# create` command an operator runs separately.
[mounts]
  source = "repodiet_persistent"
  destination = "/persistent"

# Bumped 512mb -> 1024mb -> 2048mb, each step after a real, live OOM kill
# of the openclaw-gateway process (~15 minutes uptime at 512mb, ~65
# minutes at 1024mb) — sustained operational pressure once the Gateway,
# the seller runtime, and XMTP are all genuinely active together, not a
# boot-time spike. Confirmed via `dmesg`-surfaced "Out of memory: Killed
# process" in `fly logs` and the resulting supervisor
# `required_child_exited` / full VM reboot each time. CPU count
# deliberately left at 1 (shared-cpu-1x) both times — only memory was the
# observed constraint. See docs/SELLER_RUNTIME_DEPLOYMENT.md ("Incident
# #9") for the full writeup and the actual peak/steady-state RSS measured
# after this bump.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

# Exactly one production Machine is intended. This file does not itself
# enforce machine count (that is a `fly scale count 1` / `fly machine run`
# concern at deploy time, and the GitHub Actions workflow in
# .github/workflows/fly-deploy.yml is written to never create a second
# Machine) — see the runbook's "Operator commands" section for the exact
# verification command (`fly machine list --app repodiet-agent-9636`).
